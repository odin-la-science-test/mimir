services:
  - type: web
    name: mimir-bot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --only=production
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TTS_VOICE
        value: fr-FR-HenriNeural
